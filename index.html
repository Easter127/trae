<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>苔藓3D交互场景</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #0f2a0a 0%, #051003 100%);
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      padding: 20px;
    }
    h1 {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.1em;
      opacity: 0.8;
    }
    nav {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 100;
    }
    .logo {
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      opacity: 0.6;
    }
    .menu {
      display: flex;
      gap: 30px;
    }
    .menu a {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      transition: all 0.3s ease;
    }
    .menu a:hover {
      color: white;
    }
    .info {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 0.75rem;
      opacity: 0.5;
      z-index: 100;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.5); }
    }
  </style>
</head>
<body>
  <canvas id="mossCanvas"></canvas>
  
  <nav>
    <div class="logo">ANKWARD CORP.</div>
    <div class="menu">
      <a href="#home">HOME</a>
      <a href="#about">ABOUT</a>
      <a href="#contact">CONTACT</a>
    </div>
  </nav>

  <div class="content">
    <h1>TIME TO STYLE</h1>
    <h2>THE MOSS INDUSTRY</h2>
  </div>

  <div class="info">
    <div><span class="pulse"></span> 实时渲染</div>
    <div><span class="pulse"></span> 鼠标交互</div>
  </div>

  <script>
    const canvas = document.getElementById('mossCanvas');
    const ctx = canvas.getContext('2d');
    
    let mouseX = 0;
    let mouseY = 0;
    let particles = [];
    const particleCount = 500;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createParticles() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 50 + Math.random() * 200;
        particles.push({
          x: canvas.width / 2 + Math.cos(angle) * radius,
          y: canvas.height / 2 + Math.sin(angle) * radius,
          size: 2 + Math.random() * 4,
          speed: 0.1 + Math.random() * 0.3,
          color: `hsl(${100 + Math.random() * 40}, ${60 + Math.random() * 30}%, ${20 + Math.random() * 30}%)`,
          baseHeight: 1 + Math.random() * 3,
          offset: Math.random() * Math.PI * 2
        });
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 16, 3, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      particles.forEach((p, i) => {
        const dx = mouseX - p.x;
        const dy = mouseY - p.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        const influence = Math.max(0, 1 - distance / 200);
        const height = p.baseHeight + influence * 5;
        const sway = Math.sin(Date.now() * 0.002 + p.offset) * 10;

        const gradient = ctx.createRadialGradient(
          p.x + sway, p.y, 0,
          p.x + sway, p.y, p.size * height
        );
        
        const brightness = 30 + influence * 30;
        gradient.addColorStop(0, `hsla(${100 + influence * 20}, 70%, ${brightness}%, 0.8)`);
        gradient.addColorStop(0.5, `hsla(${100 + influence * 10}, 60%, ${brightness - 10}%, 0.4)`);
        gradient.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.arc(p.x + sway, p.y - height * 5, p.size * (1 + influence), 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      });

      const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 150);
      coreGradient.addColorStop(0, 'hsla(120, 80%, 50%, 0.2)');
      coreGradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(centerX, centerY, 150, 0, Math.PI * 2);
      ctx.fillStyle = coreGradient;
      ctx.fill();

      requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('resize', () => {
      resize();
      createParticles();
    });

    resize();
    createParticles();
    animate();
  </script>
</body>
</html>
